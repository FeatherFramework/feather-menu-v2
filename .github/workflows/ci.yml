name: ci

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 tests/lua/validation_spec.lua .
      - run: lua5.4 tests/lua/runtime_spec.lua .

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Verify packaged NUI entrypoint
        shell: bash
        run: test -f ../ui/index.html && test -n "$(find ../ui/assets -maxdepth 1 -type f -print -quit)"
      - name: Build and inspect install ZIP
        run: |
          python3 ../scripts/package_release.py
          python3 ../scripts/verify_release.py ../.artifacts/feather-menu-v2.zip
