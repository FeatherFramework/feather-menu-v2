name: release

on:
  push:
    branches: [main]
    tags: ['v2.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify Lua validation and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          lua5.4 tests/lua/validation_spec.lua .
          lua5.4 tests/lua/runtime_spec.lua .
      - name: Install and verify UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: Stage and verify install archive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_release.py
          cp .artifacts/feather-menu-v2.zip .artifacts/feather-menu-v2.zip.sha256 .
          python3 scripts/verify_release.py feather-menu-v2.zip
          sha256sum -c feather-menu-v2.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: feather-menu-v2-install
          path: |
            feather-menu-v2.zip
            feather-menu-v2.zip.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: feather-menu-v2-install
      - name: Publish tested tag artifact without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./web/package.json').version")
          test "$TAG" = "v$version"
          grep -Fq "version '$version'" fxmanifest.lua
          sha256sum -c feather-menu-v2.zip.sha256
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" feather-menu-v2.zip feather-menu-v2.zip.sha256 --verify-tag --title "Feather Menu v2 $version" --generate-notes "${flags[@]}"
